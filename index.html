<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- 第十七批（judge 第九輪）：theme-color 移到內嵌腳本前面，腳本一起照畫面顏色設（和 app.js 的 applyScheme、manifest.json 同一組色）。
     v0.5.5（作者 iPhone：頁面頂端狀態列後面一條白霧）：淺色從 wood #5c3a1e 改成頁面底色 #f5f0e6，深色照舊 #1c1814（＝bg），狀態列和頁面同色 -->
<meta name="theme-color" content="#f5f0e6">
<!-- 第十六批（judge 第八輪）：先照「我 → 畫面顏色」的設定掛 data-scheme，CSS 第一幀就對（手動淺色＋系統深色時不再先閃深色，
     手動深色＋系統淺色時不再先閃淺色）。規則和 app.js 的 applyScheme 一樣；讀不到設定（私密模式等）就不掛，交給 CSS 的 prefers-color-scheme -->
<script>(function () { try { var s = JSON.parse(localStorage.getItem('gomoku.settings.v1') || '{}') || {}, m = s.scheme; var d = m === 'dark' || (m !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.setAttribute('data-scheme', d ? 'dark' : 'light'); var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', d ? '#1c1814' : '#f5f0e6'); } catch (e) { /* ignore */ } })();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="不用註冊的網頁五子棋：跟電腦下、兩人一起下、回頭看這盤、練習題。資料只存在你的裝置。">
<meta property="og:description" content="Standalone Gomoku: play the computer, play with a friend, look back at a game, and practice puzzles. Your data stays only on your device.">
<!-- 第十八批：主流瀏覽器多半不看這個標頭，保留無害（實際照伺服器的標頭；GitHub Pages 的 HTML 大約快取 10 分鐘）。其餘檔案靠網址上的 ?v=版本號 換新 -->
<meta http-equiv="Cache-Control" content="no-cache">
<!-- 第十八批：第一幀就是「五子棋」（app.js 跑完照語言再設一次） -->
<title>五子棋</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- 第十八批：版本號與載入網址。所有要載入的檔（manifest、style.css、九支 script、app.js 裡的 ai-worker.js 與 data/puzzles.json、
     ai-worker.js 裡 importScripts 的 data/openings.js、data/tengen-book.js 與 ai.js）網址後面都帶 v 參數（值＝GOMOKU_VERSION），改版後新開的頁面一定重抓。
     第二十批 b 改正：頁面開著時發布了新版，這一頁的版本號還是舊的，之後才建的 Worker（或快取過期）會從伺服器拿到新的 ai-worker.js、ai.js，
     仍可能新舊混用；ai-worker.js 啟動時回報自己的版本號，和這裡不一樣時畫面上方出現「有新版本，請重新整理」。
     網址由 gomokuUrl() 從這一個常數組出來；<link>、<script> 用 document.write 寫出，和寫死的標籤一樣由解析器載入（style.css 照樣擋住第一幀、
     script 照順序在 DOMContentLoaded 前跑完），開發伺服器上也一樣能跑。打包時 release.py 改這裡的 GOMOKU_VERSION（v0.5.<序號>），第二十批 b 起連 ai-worker.js 的 GOMOKU_WORKER_VERSION 一起改。
     第十六批（主線拍板）：拿掉 Google Fonts——關於頁承諾資料不外傳，載網路字型會把 IP 送給 Google，沒網路時還會閃。字型只用系統字（style.css 的字型堆疊） -->
<script>var GOMOKU_VERSION = 'v0.5.23'; // 版本號（規格 I；README 要同步）。第十八批起帶 build 編號；發布版由 release.py 改成 v0.5.<序號>。
// 第二十批 b：ai-worker.js 的 GOMOKU_WORKER_VERSION 要和這裡同一個值（release.py 兩處一起改、發布檢查會比對）
var GOMOKU_RELEASE = true; // 第十二批 c：正式上線前改成 true，網址帶 ?test=1 也不會掛測試用的小門（window.__gomokuApp）
function gomokuUrl(p) { return p + '?v=' + encodeURIComponent(GOMOKU_VERSION); }
document.write('<link rel="manifest" href="' + gomokuUrl('manifest.json') + '">\n<link rel="stylesheet" href="' + gomokuUrl('style.css') + '">');</script>
</head>
<!-- v0.5.10（規格 AS）：body 的 data-page＝目前這一頁（app.js 的 showPage 換；練習題／開局是 learn-puzzles／learn-openings），
     style.css 的平板版面靠它決定哪幾頁放寬、哪幾頁分兩欄。第一幀就是下棋分頁 -->

<main>
  <!-- 第十四批（規格 V）：底部四個分頁（下棋／練習／紀錄／我）。「更多」區塊拿掉，內容分到「我」與「練習」。
       分頁切換只換顯示（showPage），不重新載入；每個分頁記得自己停在哪一頁（練習題、關於）。 -->
  <section id="play" class="tab-page">
    <div class="topbar"><h1 data-i18n="app.title"></h1><button type="button" id="profileBtn" class="link profile-chip" data-profiles></button></div>
    <!-- 第二十批 b（主線核准）：電腦每一級的分數重量過了。有舊戰績的帳號第一次開下棋分頁時說一次（可關閉；看過記在 gomoku.settings.v1 的 recalSeen） -->
    <div id="recalNote" class="notice-pill" role="status" hidden>
      <p data-i18n="notice.recal"></p>
      <button type="button" class="link notice-close" id="recalClose" data-i18n="notice.close"></button>
    </div>
    <!-- v0.5.10（規格 AS）：橫拿平板時選單分兩欄（左：#oppCard；右：#ruleCard、#clockCard、#sideCard），id 給 style.css 排位置用 -->
    <div id="oppCard" class="card">
      <h2 data-i18n="menu.opponent"></h2>
      <div class="seg">
        <label><input type="radio" name="mode" value="pve" checked><span data-i18n="menu.pve"></span></label>
        <label><input type="radio" name="mode" value="pvp"><span data-i18n="menu.pvp"></span></label>
      </div>
      <div id="aiOpts" class="ai-opts">
        <div class="seg wrap" role="radiogroup" data-i18n-attr="aria-label:menu.level">
          <label><input type="radio" name="level" value="novice"><span data-i18n="group.novice"></span></label>
          <label><input type="radio" name="level" value="easy"><span data-i18n="group.easy"></span></label>
          <label><input type="radio" name="level" value="medium" checked><span data-i18n="group.medium"></span></label>
          <label><input type="radio" name="level" value="hard"><span data-i18n="group.hard"></span></label>
          <label><input type="radio" name="level" value="expert"><span data-i18n="group.expert"></span></label>
        </div>
        <div id="subSeg" class="seg sub" role="radiogroup" data-i18n-attr="aria-label:level.subLabel" hidden>
          <label><input type="radio" name="sub" value="1"><span>1</span></label>
          <label><input type="radio" name="sub" value="2"><span>2</span></label>
          <label><input type="radio" name="sub" value="3"><span>3</span></label>
          <label><input type="radio" name="sub" value="4"><span>4</span></label>
        </div>
        <div class="rec-row">
          <button type="button" class="link" id="recommendBtn" data-i18n="menu.recommend"></button>
          <span id="levelNote" class="level-note" aria-live="polite"></span>
        </div>
      </div>
      <!-- v0.5.5（作者：次選項格式統一）：選了上面那一格才出現的次選項，一律是 .subopt 小區（tint 底、上面一行小標、下面可有一行小字）。
           兩人一起下分兩個小區：誰來下（兩邊的帳號＋各自的提示開關＋同一個帳號的小字）、手機怎麼放 -->
      <div id="pvpOpts" class="pvp-opts" hidden>
        <div class="subopt pvp-who" role="group" aria-labelledby="pvpWhoLabel">
          <!-- v0.5.10（規格 AT）：小標右邊一顆「⇅ 交換」（有字）＝黑白兩位玩家對調，提示與兩人不同的時間跟著人走。
               外觀是膠囊小鈕（.pill，同「規則說明」），按得到的範圍是外層 44 高的按鈕；讀屏名稱「交換黑白」 -->
          <div class="pvp-who-head">
            <div class="subopt-label" id="pvpWhoLabel" data-i18n="pvp.who"></div>
            <button type="button" id="pvpSwap" class="link pvp-swap" data-i18n-attr="aria-label:pvp.swapLabel"><span class="pill" data-i18n="pvp.swap"></span></button>
          </div>
          <!-- 規格 AL：每位玩家自己的「提示」；記在這台裝置（settings.pvpHintB／pvpHintW）。
               v0.5.5（作者拍板）：一位玩家一行「黑棋 [帳號 ▾] [提示關 ▾]」，提示四選一（提示關／提示危險／提示機會／提示全部，沒有「提示」標籤，讀屏名稱在 aria-label，選項由 app.js 的 fillHintSel 填）；
               320 寬時兩個下拉選單一起縮短（帳號名字先用 … 收尾），說明是小區最下面共用的一行小字 -->
          <div class="pvp-player">
            <label class="pick"><span data-i18n="pvp.black"></span><select id="pvpB"></select></label>
            <label class="pvp-hint"><select id="pvpHintB" data-i18n-attr="aria-label:pvp.hintB"></select></label>
          </div>
          <div class="pvp-player">
            <label class="pick"><span data-i18n="pvp.white"></span><select id="pvpW"></select></label>
            <label class="pvp-hint"><select id="pvpHintW" data-i18n-attr="aria-label:pvp.hintW"></select></label>
          </div>
          <p class="subopt-note pvp-hint-note" data-i18n="pvp.hintSub"></p>
          <p id="pvpNote" class="subopt-note pvp-note" hidden></p>
        </div>
        <!-- 第二十四批（規格 Z1，作者拍板）：手機怎麼放。平放＝上方整條（座位條、提醒卡）轉 180°；輪流拿＝都不轉、提醒卡固定在下方 -->
        <div class="subopt pvp-lay-box">
          <div class="subopt-label" id="pvpLayLabel" data-i18n="pvp.layLabel"></div>
          <div class="seg pvp-lay" role="radiogroup" aria-labelledby="pvpLayLabel">
            <label><input type="radio" name="pvpLay" value="flat" checked><span data-i18n="pvp.layFlat"></span></label>
            <label><input type="radio" name="pvpLay" value="hand"><span data-i18n="pvp.layHand"></span></label>
          </div>
        </div>
      </div>
    </div>
    <div id="ruleCard" class="card">
      <div class="card-head">
        <h2 data-i18n="menu.rule"></h2>
        <button type="button" class="link" data-rule-help data-i18n="help.open"></button>
      </div>
      <div class="seg">
        <label><input type="radio" name="rule" value="free" checked><span data-i18n="rule.free"></span></label>
        <label><input type="radio" name="rule" value="renju"><span data-i18n="rule.renju"></span></label>
      </div>
      <!-- 第十三批 b（規格 U）：選連珠規則時，按鈕正下方出現二選一；選的存在帳號（GS 帳號的 forbid）。
           第十四批（W 第 7 條）：例外那句（同一步剛好連成五）移到規則說明面板 -->
      <!-- v0.5.5：次選項小區（.subopt）。小標「黑棋下到禁手時」的「禁手」點了開名詞對照表；按鈕兩行（主字＋小字），不用會斷在括號裡的長句 -->
      <div id="forbidOpts" class="subopt forbid-opts" hidden>
        <div class="subopt-label" id="forbidLabel" data-i18n-terms="forbid.title"></div>
        <div class="seg" role="radiogroup" aria-labelledby="forbidLabel">
          <label><input type="radio" name="forbid" value="block"><span><b data-i18n="forbid.block"></b><small data-i18n="forbid.blockSub"></small></span></label>
          <label><input type="radio" name="forbid" value="lose"><span><b data-i18n="forbid.lose"></b><small data-i18n="forbid.loseSub"></small></span></label>
        </div>
      </div>
    </div>
    <!-- 第二十四批（規格 Z4、Z7 第 2 條）：棋鐘。跟電腦下只有「不限時／每步限時」；兩人一起下多「每盤限時」與「兩人時間不同」。
         存在目前帳號（帳號的 clock）。選項按鈕由 app.js 的 renderClockCard 依模式與設定畫 -->
    <div id="clockCard" class="card">
      <h2 data-i18n="clock.title"></h2>
      <div id="clockKind" class="seg" role="radiogroup" data-i18n-attr="aria-label:clock.title"></div>
      <!-- v0.5.5：選了「每步限時／每盤限時」才出現的次選項小區（.subopt）：小標「每步幾秒／每盤幾分鐘」、兩人時間不同（兩人一起下）、時間、小字 -->
      <div id="clockSub" class="subopt clock-sub" hidden>
        <div class="subopt-label" id="clockSubLabel"></div>
        <label id="clockSplitRow" class="switch clock-split" hidden><input type="checkbox" id="clockSplit"><span><b data-i18n="clock.split"></b></span></label>
        <div id="clockOpts" class="clock-opts"></div>
        <p id="clockNote" class="subopt-note clock-note"></p>
      </div>
    </div>
    <div id="sideCard" class="card">
      <h2 data-i18n="menu.side"></h2>
      <div class="seg">
        <label><input type="radio" name="side" value="1" checked><span data-i18n="side.black"></span></label>
        <label><input type="radio" name="side" value="2"><span data-i18n="side.white"></span></label>
      </div>
    </div>
    <!-- 第二十二批（規格 Y 第 2 條、作者選「選單 A」）：大按鈕移到三張卡之後，黏在分頁列正上方（position: sticky）。
         按鈕內兩行：「再下一盤／開始下棋」＋這一次按下去會用的設定（不是「上次」；設定改了跟著變） -->
    <div class="start-box">
      <button id="startBtn" type="button" class="big"><span id="startMain"></span><small id="startSub" class="start-sub"></small></button>
    </div>
  </section>

  <!-- 練習分頁：五張卡（今天的題目、練習題、26 種開局、擺棋盤研究、規則說明）。v0.5.15（規格 AU 第二版）：多「擺棋盤研究」。
       v0.5.17（規格 AV）：最上面多「今天的題目」：題目難度（#dailyWhat）、今天做過沒（#dailyState；做對時右上一個勾 #dailyCheck）、連續天數（#dailyStreak），
       字由 app.js 的 renderDailyCard 寫；點進去是練習題畫面（learnTab 'daily'）。
       v0.5.20（規格 AJ）：「26 種開局」下面多一張「天元的開局」（開局探索、開局練習，#teach），共六張 -->
  <section id="practice" class="tab-page" hidden>
    <h2 class="tab-title" data-i18n="tab.practice"></h2>
    <button type="button" class="nav-card daily-card" id="pracDaily"><span class="daily-head"><b data-i18n="daily.title"></b><span id="dailyCheck" class="daily-check" aria-hidden="true" hidden>&#10003;</span></span><small id="dailyWhat"></small><span id="dailyState" class="daily-state"></span><small id="dailyStreak"></small></button>

  <!-- 我分頁：帳號、外觀、語言、動畫與音效、威脅提醒、關於 -->
  <section id="me" class="tab-page" hidden>
    <h2 class="tab-title" data-i18n="tab.me"></h2>
    <div class="card">
      <h3 data-i18n="me.account"></h3>
      <div class="me-account"><button type="button" id="meProfileBtn" class="link profile-chip" data-profiles></button></div>
      <button type="button" class="secondary wide" id="meProfilesBtn" data-profiles data-i18n="me.manage"></button>
    </div>
    <!-- 第八批 b：外觀（規格 R、S）。棋盤風格存在帳號；介面顏色、動畫、音效存在這台裝置 -->
    <div id="lookBox" class="card look">
      <h3 data-i18n="look.title"></h3>
      <div class="pick-label" id="themeLabel" data-i18n="look.style"></div>
      <div id="themePick" class="theme-pick" role="radiogroup" aria-labelledby="themeLabel">
        <label><input type="radio" name="theme" value="classic"><span><canvas data-theme-preview="classic" aria-hidden="true"></canvas><small data-i18n="theme.classic"></small></span></label>
        <label><input type="radio" name="theme" value="slate"><span><canvas data-theme-preview="slate" aria-hidden="true"></canvas><small data-i18n="theme.slate"></small></span></label>
        <label><input type="radio" name="theme" value="paper"><span><canvas data-theme-preview="paper" aria-hidden="true"></canvas><small data-i18n="theme.paper"></small></span></label>
        <label><input type="radio" name="theme" value="playful"><span><canvas data-theme-preview="playful" aria-hidden="true"></canvas><small data-i18n="theme.playful"></small></span></label>
        <label><input type="radio" name="theme" value="contrast"><span><canvas data-theme-preview="contrast" aria-hidden="true"></canvas><small data-i18n="theme.contrast"></small></span></label>
      </div>
      <div class="pick-label" id="schemeLabel" data-i18n="look.scheme"></div>
      <div class="seg small" role="radiogroup" aria-labelledby="schemeLabel">
        <label><input type="radio" name="scheme" value="system"><span data-i18n="scheme.system"></span></label>
        <label><input type="radio" name="scheme" value="light"><span data-i18n="scheme.light"></span></label>
        <label><input type="radio" name="scheme" value="dark"><span data-i18n="scheme.dark"></span></label>
      </div>
    </div>
    <!-- 規格 AM：下子方式（直接下／點兩下確認），跟著這台裝置（settings.placeMode）；小字順便說兩指可以放大 -->
    <div class="card">
      <h3 id="placeLabel" data-i18n="opt.place"></h3>
      <div class="seg small" role="radiogroup" aria-labelledby="placeLabel">
        <label><input type="radio" name="placeMode" value="direct"><span data-i18n="opt.placeDirect"></span></label>
        <label><input type="radio" name="placeMode" value="confirm"><span data-i18n="opt.placeConfirm"></span></label>
      </div>
      <p class="note place-note" data-i18n="opt.placeSub"></p>
    </div>
    <div class="card">
      <label class="switch"><input type="checkbox" id="optAnim"><span><b data-i18n="opt.anim"></b><small data-i18n="opt.animSub"></small></span></label>
      <label class="switch"><input type="checkbox" id="optSound"><span><b data-i18n="opt.sound"></b><small data-i18n="opt.soundSub"></small></span></label>
      <label class="switch"><input type="checkbox" id="optHints"><span><b data-i18n="opt.hints"></b><small data-i18n="opt.hintsSub"></small><small id="hintsPvpNote" class="teach-note"></small></span></label>
      <label class="switch"><input type="checkbox" id="optOwnRoad"><span><b data-i18n="opt.ownRoad"></b><small data-i18n="opt.ownRoadSub"></small></span></label>
      <!-- 第二十四批（規格 Z10）：教學：顯示連續逼殺路。兩個提示開關當下都生效時才能開，不能開時灰掉並在 #teachNote 寫原因 -->
      <label class="switch"><input type="checkbox" id="optTeach"><span><b data-i18n="opt.teach"></b><small data-i18n="opt.teachSub"></small><small id="teachNote" class="teach-note"></small></span></label>
      <label class="switch"><input type="checkbox" id="optPonder"><span><b data-i18n="opt.ponder"></b><small data-i18n="opt.ponderSub"></small></span></label>
    </div>
    <!-- v0.5.5（作者）：語言卡搬到「關於」的正上方 -->
    <div class="card">
      <h3 data-i18n="me.lang"></h3>
      <button type="button" id="langBtn" class="secondary wide lang"></button>
    </div>
    <button type="button" class="nav-card" id="aboutBtn"><b data-i18n="nav.about"></b></button>
  </section>

  <!-- 第二十四批（規格 Z，對局頁 v2「對坐」）：由上到下＝上方座位條（對手：棋罐在左上）→ 上方區 → 棋盤 → 下方區（規則與開局一行小字）
       → 下方座位條（「⋯」、悔棋、名字＋徽章＋分數、棋鐘或「換你囉」、棋罐在右下）。上下兩區一樣高，平分多出的高度（棋盤在兩條座位條之間置中）。
       兩人一起下、手機平放時上方座位條轉 180°（#game 的 lay-flat）。結算卡浮在棋盤上。
       規格 Z9（作者再拍板）：沒有提醒卡，提醒句只給讀屏（#hints 一律 sr-only），畫面上是棋盤的光環與懸浮標籤（#haloLabels）。
       回頭看沿用原本的結構（對戰條 #oppInfo、狀態行 #status、#subStatus、#gameExtra、棋盤、回頭看列與面板），對局用的那幾塊藏起來（#game 沒有 playing） -->
  <section id="game" hidden>
    <div id="oppInfo" class="opp-info"></div>
    <div id="status" aria-live="polite"></div>
    <div id="subStatus" class="sub-status"></div>
    <!-- 第二十五批（作者 2026-10-01）：拿掉回頭看的「換風格」；這一列只剩「回到這盤棋」，那顆藏起來時整列也藏（app.js setReviewUI） -->
    <div id="gameExtra" class="extra" hidden>
      <button type="button" class="link" id="rvBackBtn" data-i18n="review.backGame"></button>
    </div>
    <div id="seatTop" class="seat top">
      <div id="cupTop" class="cup" role="img"><span class="cup-body"><canvas class="cup-glow" aria-hidden="true"></canvas><canvas class="cup-thick" aria-hidden="true"></canvas><canvas class="cup-jar" aria-hidden="true"></canvas></span></div>
      <div id="whoTop" class="seat-who"></div>
      <div id="turnTop" class="seat-turn"></div>
    </div>
    <div id="zoneTop" class="zone top"></div>
    <!-- 規格 AM：棋盤放大。#boardFrame 是放大用的框（藏住框外的部分），#boardLayer 是跟著放大的那一層（棋盤＋懸浮標籤）；放大時角落一顆「還原」 -->
    <div id="boardWrap"><div id="boardFrame" class="zoom-frame"><div id="boardLayer" class="zoom-layer"><canvas id="board" tabindex="-1" data-i18n-attr="aria-label:game.board"></canvas>
      <div id="haloLabels" class="halo-labels"></div></div>
      <button type="button" id="boardZoomReset" class="zoom-reset" hidden data-i18n="zoom.reset" data-i18n-attr="aria-label:zoom.resetLabel"></button></div>
      <!-- 天元那一批（規格 AN）：開場字卡 D「落子揮毫」。跟天元下的每一盤開始時（含再來一盤）疊在棋盤上 1.6 秒，點一下跳過；減少動態效果時不出。
           位置與大小由 app.js 的 placeCard 對齊棋盤；讀屏念 #tgSay（對手：天元） -->
      <div id="tgCard" hidden aria-hidden="true">
        <div class="veil"></div>
        <div class="at"><i class="c-ring"></i></div>
        <div class="at"><i class="gglow c-flash"></i></div>
        <div class="at"><i class="c-shadow"></i></div>
        <div class="at"><i class="c-drop"><i class="c-stone"></i></i></div>
        <div class="plq">
          <!-- v0.5.5：書法字「天元」一筆一筆照筆順寫出來（app.js 的 cardInk，畫在 canvas 上，每一幀用 requestAnimationFrame 畫；不用遮罩裡的 CSS 動畫）。
               .tg-static 是備用的靜態字（canvas／Path2D 不能用或畫的時候出錯時才淡入，只帶飛白遮罩） -->
          <div class="tg-ink"><canvas id="tgInk"></canvas>
            <svg class="tg-static" viewBox="0 0 2000 1000" aria-hidden="true" focusable="false"><g mask="url(#kFb)" fill="url(#kGold)"><use href="#kg-zmx-T"/><use href="#kg-zmx-Y" x="1000"/></g></svg></div>
        </div>
      </div>
      <div id="flashTip" class="flash-tip" role="status" hidden></div>
      <div id="resultBox" class="result-box" hidden>
        <h2 id="resultTitle" class="rs-title"></h2>
        <div id="resultLines" aria-live="polite"></div>
        <div class="rs-btns">
          <button type="button" id="rsAgain" data-i18n="result.again"></button>
          <button type="button" id="rsReview" data-i18n="review.enter"></button>
          <!-- v0.5.10（規格 AT）：兩人一起下才有的「換邊再下一盤」（交換黑白＋再來一盤），自己一整行 -->
          <button type="button" id="rsSwap" data-i18n="result.swapAgain" hidden></button>
        </div>
        <div class="rs-links">
          <button type="button" class="link" id="rsMenu" data-i18n="game.menu"></button>
          <button type="button" class="link" id="rsUndo" data-i18n="game.undoSub"></button>
          <!-- v0.5.19（規格 AW）：「分享圖片」（跟電腦下、兩人一起下都有）＝棋盤＋上方一行結果＋下方 app 名稱與網址做成一張圖（app.js 的 shareNow） -->
          <button type="button" class="link" id="rsShare" data-i18n="share.btn"></button>
        </div>
        <!-- v0.5.19（規格 AW）：叫不出系統分享、改成下載時的一行小字（使用者自己取消分享不出字） -->
        <p id="rsShareMsg" class="rs-share-msg" role="status" hidden></p>
      </div>
    </div>
    <div id="zoneBottom" class="zone bottom">
      <p id="gameInfo" class="game-info"></p>
      <div id="hints" class="hints sr-only" hidden>
        <div id="hintBody" class="hint-body" aria-live="polite"></div>
      </div>
    </div>
    <div id="seatBottom" class="seat bottom">
      <!-- 第十五批：「⋯」字元在預設字型下太小，改成三個圓點的 SVG。第二十四批（Z7 第 1 條）：悔棋留在外面，「⋯」右邊一顆，一下就能按 -->
      <button id="moreBtn" type="button" class="secondary more-btn" aria-haspopup="dialog" data-i18n-attr="aria-label:game.more"><svg class="icon-dots" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="2.25"/><circle cx="12" cy="12" r="2.25"/><circle cx="19" cy="12" r="2.25"/></svg></button>
      <button id="undoBtn" type="button" class="secondary undo-btn" data-i18n-attr="aria-label:game.undoLabel"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M9 14 4 9l5-5M4.5 9H14a5.5 5.5 0 0 1 0 11h-3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="game.undo"></span></button>
      <div id="whoBottom" class="seat-who"></div>
      <div id="turnBottom" class="seat-turn"></div>
      <div id="cupBottom" class="cup" role="img"><span class="cup-body"><canvas class="cup-glow" aria-hidden="true"></canvas><canvas class="cup-thick" aria-hidden="true"></canvas><canvas class="cup-jar" aria-hidden="true"></canvas></span></div>
    </div>
    <div id="turnLive" class="sr-only" aria-live="polite"></div>
    <div id="tgSay" class="sr-only" aria-live="polite"></div>
    <div id="reviewBar" class="review-bar" hidden>
      <div class="rv-nav">
        <button type="button" class="secondary" id="rvFirst" data-i18n-attr="aria-label:review.first">⏮</button>
        <button type="button" class="secondary" id="rvPrev" data-i18n-attr="aria-label:review.prev">◀</button>
        <span id="rvCount" class="rv-count">0/0</span>
        <button type="button" class="secondary rv-next" id="rvNext" data-i18n="review.nextBtn" data-i18n-attr="aria-label:review.next"></button>
        <button type="button" class="secondary" id="rvLast" data-i18n-attr="aria-label:review.last">⏭</button>
      </div>
      <!-- v0.5.14（規格 AU）：拉桿右邊一顆小膠囊「手數」＝棋子上顯示手數（回頭看自己的開關，預設開；aria-pressed）。
           拉桿與「沒算完」的刻痕包在 .rv-track 裡，刻痕照舊對齊拉桿 -->
      <div class="rv-slide">
        <div class="rv-track">
          <input type="range" id="rvRange" min="0" max="0" value="0" data-i18n-attr="aria-label:review.range">
          <div id="rvMarks" class="rv-marks" aria-hidden="true"></div>
        </div>
        <button type="button" id="rvNums" class="link rv-nums" aria-pressed="true" data-i18n-attr="aria-label:nums.label"><span class="pill" data-i18n="nums.pill"></span></button>
      </div>
    </div>
    <div id="reviewPanel" class="review-panel" hidden></div>
  </section>

  <!-- 紀錄分頁（原本的戰績頁）：分頁的第一層，沒有返回鈕 -->
  <section id="stats" class="tab-page" hidden>
    <div class="page-head"><h2 data-i18n="stats.title"></h2><button type="button" id="statsProfileBtn" class="link profile-chip" data-profiles></button></div>
    <div id="statsBody"></div>
    <div class="row-btns">
      <button type="button" class="secondary" id="exportBtn" data-i18n="stats.export"></button>
      <button type="button" class="secondary" id="importBtn" data-i18n="stats.import"></button>
      <button type="button" class="secondary danger" id="clearBtn" data-i18n="stats.clear"></button>
    </div>
    <p class="note export-note" data-i18n="stats.exportNote"></p>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </section>

  <!-- 練習分頁的第二層：練習題或 26 種開局（從練習分頁的卡片進來，learnTab 決定是哪一個；v0.5.17 多「今天的題目」＝練習題畫面、learnTab 'daily'） -->
  <section id="learn" class="page" hidden>
    <div class="page-head"><button type="button" class="link" data-back="practice" data-i18n="nav.backPractice"></button><h2 id="learnTitle"></h2></div>
    <div id="learnOpeningsWrap">
      <p class="note" data-i18n="learn.note"></p>
      <div id="learnSideSeg" class="side-pick">
        <span data-i18n="learn.sideLabel"></span>
        <div class="seg small">
          <label><input type="radio" name="learnSide" value="2" checked><span data-i18n="learn.sideWhite"></span></label>
          <label><input type="radio" name="learnSide" value="1"><span data-i18n="learn.sideBlack"></span></label>
        </div>
      </div>
      <div id="learnOpenings"></div>
      <button type="button" class="secondary wide" disabled data-i18n="learn.loadKifu"></button>
    </div>
    <div id="learnPuzzles" hidden>
      <div class="seg small">
        <label><input type="radio" name="pztype" value="attack" checked><span data-i18n="learn.pzAttack"></span></label>
        <label><input type="radio" name="pztype" value="defend"><span data-i18n="learn.pzDefend"></span></label>
        <label><input type="radio" name="pztype" value="judge"><span data-i18n="learn.pzJudge"></span></label>
      </div>
      <!-- 第十四批（W 第 4 條）：級數列前加看得到的「要幾步：」；預設入門。
           AH-1：判斷題沒有步數，同一列換成「難度：易／中／難」（#pzJLevels，class 不用 pz-levels：舊腳本數 .pz-levels label） -->
      <div class="pz-levels-row">
        <span class="pz-levels-label" id="pzLevelsLabel" data-i18n="learn.pzLevelsLead"></span>
        <span class="pz-levels-label" id="pzJLevelsLabel" data-i18n="learn.pzJudgeLevelsLead" hidden></span>
      <div class="seg small pz-jlevels" id="pzJLevels" role="radiogroup" aria-labelledby="pzJLevelsLabel" hidden>
        <label><input type="radio" name="pzjl" value="easy" checked><span data-i18n="learn.pzLevelEasy"></span></label>
        <label><input type="radio" name="pzjl" value="medium"><span data-i18n="learn.pzLevelMedium"></span></label>
        <label><input type="radio" name="pzjl" value="hard"><span data-i18n="learn.pzLevelHard"></span></label>
      </div>
      <div class="seg small pz-levels" id="pzNLevels" role="radiogroup" aria-labelledby="pzLevelsLabel">
        <label><input type="radio" name="pzn" value="1" checked><span data-i18n="learn.pzLevel1"></span></label>
        <label><input type="radio" name="pzn" value="2"><span>2</span></label>
        <label><input type="radio" name="pzn" value="3"><span>3</span></label>
        <label><input type="radio" name="pzn" value="4"><span>4</span></label>
        <label><input type="radio" name="pzn" value="5"><span>5</span></label>
      </div>
      </div>
      <p id="pzInfo" class="pz-info"></p>
      <!-- AH-1：判斷題只有連珠規則。選單是自由規則時先說一句（#pzInfo 寫 jd.renjuOnly），按這顆才出題（只用在這組題目，不改選單的規則） -->
      <button type="button" class="secondary wide" id="pzJudgeGo" data-i18n="learn.pzJudgeGo" hidden></button>
      <!-- AH-1 複審第二輪：判斷題題庫讀不到時，在「題目打不開」下面出「再試一次」（#pzArea 藏著，裡面的「重來」按不到） -->
      <button type="button" class="secondary wide" id="pzJudgeRetry" data-i18n="learn.pzLoadRetry" hidden></button>
      <!-- v0.5.17（規格 AV）：「今天的題目」才有的一行：今天做對了沒（連續天數）、看過答案不算、已經換日了（app.js 的 renderPzDaily）。
           #learn.daily 時題型、步數兩列和上一題／下一題藏起來（style.css） -->
      <p id="pzDaily" class="pz-daily" hidden></p>
      <div id="pzArea">
        <p id="pzMsg" class="pz-msg" aria-live="polite"></p>
        <!-- 第十二批 c：計時和「換風格」併成一列；難度說明、防守題小字移到棋盤下方，375×667 棋盤不用捲就完整看得到。
             第二十五批：拿掉「換風格」（換外觀統一在「我」分頁與對局「⋯」的「外觀」），這一列只剩計時 -->
        <div class="extra pz-extra"><span id="pzTimer" class="pz-timer"></span></div>
        <div class="pz-board"><div id="pzFrame" class="zoom-frame"><div id="pzLayer" class="zoom-layer"><canvas id="pzBoard" data-i18n-attr="aria-label:game.board"></canvas></div>
          <button type="button" id="pzZoomReset" class="zoom-reset" hidden data-i18n="zoom.reset" data-i18n-attr="aria-label:zoom.resetLabel"></button></div></div>
        <div class="row-btns">
          <button type="button" class="secondary" id="pzPrev" data-i18n="learn.pzPrev"></button>
          <button type="button" class="secondary" id="pzRetry" data-i18n="learn.pzRetry"></button>
          <button type="button" class="secondary" id="pzNext" data-i18n="learn.pzNext"></button>
        </div>
        <button type="button" class="secondary wide" id="pzShow" data-i18n="learn.pzShow" hidden></button>
        <!-- AH-1：判斷題答完以後：答錯時播的那條路（說明＋◀ 第幾步 ▶ 播放）、這一點的標籤與說明、這題的主題 -->
        <div id="pzJudge" class="jd-res" hidden>
          <div id="pzJudgeLine" class="jd-line" hidden>
            <p id="pzJudgeLineCap" class="jd-cap"></p>
            <div class="rb-line">
              <button type="button" class="secondary" id="pzJLPrev" data-i18n="rs.prev" data-i18n-attr="aria-label:rs.prevLabel"></button>
              <span class="rb-step" id="pzJLStep"></span>
              <button type="button" class="secondary" id="pzJLNext" data-i18n="rs.next" data-i18n-attr="aria-label:rs.nextLabel"></button>
              <button type="button" class="secondary" id="pzJLPlay"></button>
              <p class="rb-linenote" id="pzJLNote"></p>
            </div>
          </div>
          <p id="pzJudgeKind" class="jd-kind"></p>
          <p id="pzJudgeTheme" class="jd-theme"></p>
          <p id="pzJudgeThemeNote" class="jd-cap" hidden></p>
        </div>
      </div>

         兩個小棋盤（照這盤的方向：白棋第 4 步的好點、白棋下了以後黑棋第 5 步的好點）、國際比賽的舊評價、連到「練習 → 26 種開局」 -->
    <div id="helpOpening" hidden></div>
  </div>
</div>

<div id="profiles" class="modal" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="profilesTitle">
    <div class="card-head">
      <h2 id="profilesTitle" data-i18n="profile.title"></h2>
      <button type="button" class="secondary" id="profilesClose" data-i18n="help.close"></button>
    </div>
    <p class="note" data-i18n="profile.note"></p>
    <ul id="profileList" class="profile-list"></ul>
    <button type="button" class="secondary wide" id="profileAdd" data-i18n="profile.add"></button>
    <p id="profileLimit" class="note profile-limit"></p>
    <form id="profileForm" class="profile-form" hidden>
      <h3 id="profileFormTitle"></h3>
      <label class="pick"><span data-i18n="profile.name"></span><input type="text" id="profileName" maxlength="12" autocomplete="off"></label>
      <div class="pick-label" id="emojiLabel" data-i18n="profile.emoji"></div>
      <div id="emojiPick" class="emoji-pick" role="radiogroup" aria-labelledby="emojiLabel"></div>
      <div class="row-btns">
        <button type="submit" id="profileSave" data-i18n="profile.save"></button>
        <button type="button" class="secondary" id="profileCancel" data-i18n="dialog.cancel"></button>
      </div>
    </form>
  </div>
</div>

<!-- 第九批 b：換風格面板（對局、回頭看、練習題共用）。點了立刻換、不重新開局；存在目前帳號，和「更多 → 外觀」同一個設定。
     第十二批 c：縮成一排可以橫向捲的小預覽（高度不超過 120px），放在棋盤上方或下方空著的那一邊，不蓋棋盤；標題只給讀屏 -->
<div id="themePanel" class="modal sheet" hidden>
  <div class="panel strip" role="dialog" aria-modal="true" aria-labelledby="themePanelTitle">
    <h2 id="themePanelTitle" class="sr-only" data-i18n="look.style"></h2>
    <div class="theme-pick" role="radiogroup" aria-labelledby="themePanelTitle">
      <label><input type="radio" name="themeQuick" value="classic"><span><canvas data-theme-preview="classic" aria-hidden="true"></canvas><small data-i18n="theme.classic"></small></span></label>
      <label><input type="radio" name="themeQuick" value="slate"><span><canvas data-theme-preview="slate" aria-hidden="true"></canvas><small data-i18n="theme.slate"></small></span></label>
      <label><input type="radio" name="themeQuick" value="paper"><span><canvas data-theme-preview="paper" aria-hidden="true"></canvas><small data-i18n="theme.paper"></small></span></label>
      <label><input type="radio" name="themeQuick" value="playful"><span><canvas data-theme-preview="playful" aria-hidden="true"></canvas><small data-i18n="theme.playful"></small></span></label>
      <label><input type="radio" name="themeQuick" value="contrast"><span><canvas data-theme-preview="contrast" aria-hidden="true"></canvas><small data-i18n="theme.contrast"></small></span></label>
    </div>
    <button type="button" class="secondary" id="themePanelClose" data-i18n="help.close"></button>
  </div>
</div>

<!-- 第二十批 b（judge F4）：頁面開著時發布了新版、重建的背景執行緒拿到新檔時出現。不自動重整；點它才重新整理 -->
<div id="updateBox" class="update-box" role="status" hidden><button type="button" id="updatePill" class="update-pill" data-i18n="notice.update"></button></div>

<div id="dialog" class="modal" hidden>
  <div class="panel small" role="alertdialog" aria-modal="true" aria-labelledby="dialogText">
    <p id="dialogText"></p>
    <div class="row-btns" id="dialogBtns"></div>
  </div>
</div>

<!-- 第十八批：九支 script 照原本的順序寫出，網址帶版本號（GOMOKU_VERSION、gomokuUrl 在 <head>）；data/tengen-book.js 是天元開局庫（規格 AI） -->
<script>['ai.js', 'rating.js', 'themes.js', 'data/openings.js', 'data/tengen-book.js', 'i18n.js', 'stats.js', 'review.js', 'app.js'].forEach(function (f) { document.write('<script src="' + gomokuUrl(f) + '"><\/script>'); });</script>
</body>
</html>
